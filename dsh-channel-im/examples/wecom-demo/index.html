<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企微智能机器人演示台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--tx:#e6e9f0;--tx2:#8a92a6;--ok:#3fb950;--acc:#4b95f3}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:16px}
  .grid{display:grid;grid-template-columns:1fr 340px;gap:12px;max-width:1100px;margin:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  h1{font-size:16px;margin-bottom:8px} h2{font-size:13px;color:var(--tx2);margin:8px 0 6px}
  .bar{display:flex;gap:8px;align-items:center;font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#555}
  .dot.ok{background:var(--ok)} .dot.bad{background:#f85149}
  #feed{height:420px;overflow:auto;font-size:12.5px}
  .msg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#12151d}
  .msg .who{color:var(--tx2);font-size:11px} .msg pre{white-space:pre-wrap;word-break:break-all;font-size:11.5px;margin-top:4px;color:var(--tx);max-height:120px;overflow:auto}
  #log{height:220px;overflow:auto;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--tx2)}
  input,select{background:#1c212c;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:6px 8px;margin:2px 0}
  input{width:100%} button{background:var(--acc);border:none;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx2)}
  .row{display:flex;gap:6px} .grow{flex:1}
</style>
</head>
<body>
<div class="grid">
  <div>
    <div class="card">
      <h1>企业微信智能机器人 · 长连接演示台</h1>
      <div class="bar">
        <span class="dot" id="dotAuth"></span><span id="authTxt">未连接</span>
        <span style="flex:1"></span><span id="botIdTxt"></span>
        <button class="ghost" onclick="showRaw=!showRaw">原始帧: <span id="rawTxt">关</span></button>
      </div>
      <div class="bar" style="margin-top:6px">
        <button onclick="startListen()">重连/启动</button>
        <span style="font-size:11px;color:var(--tx2)">收到消息自动按 agent 模式回复（echo/openai/custom）</span>
      </div>
    </div>
    <div class="card">
      <h2>消息流</h2>
      <div id="feed"></div>
    </div>
    <div class="card">
      <h2>运行日志</h2>
      <div id="log"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>Agent 模式</h2>
      <select id="agentMode" style="width:100%">
        <option value="echo">echo 回显</option>
        <option value="openai">openai 兼容（流式）</option>
        <option value="custom">custom HTTP（对接现有 agent）</option>
      </select>
      <input id="oBase" placeholder="openai baseUrl（如 https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions）">
      <input id="oKey" placeholder="API Key">
      <input id="oModel" placeholder="model（如 qwen-plus）">
      <input id="cUrl" placeholder="customUrl（POST 事件→ {reply}）">
      <button onclick="saveCfg()">保存 agent 配置</button>
    </div>
    <div class="card">
      <h2>主动推送测试（sendMessage）</h2>
      <input id="sendUser" placeholder="userid（企微成员 userid）">
      <input id="sendText" placeholder="内容（markdown）">
      <button onclick="doSend()">推送</button>
    </div>
    <div class="card">
      <h2>说明</h2>
      <div style="font-size:12px;color:var(--tx2)">
        · 连接：config.json 中 botId/secret（智能机器人 API-长连接模式）<br>
        · 单聊/群里@机器人消息 → 自动回复<br>
        · enter_chat 事件自动发欢迎语<br>
        · 原始帧可查看完整消息结构
      </div>
    </div>
  </div>
</div>
<script>
let feed=[], showRaw=false, evt=null, status={};
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}
async function boot(){
  status=await (await fetch("/api/status")).json();
  renderStatus();
  const st=$("agentMode");
  st.value=status.agent?.mode||"echo";
  $("oBase").value=status.agent?.openai?.baseUrl||""; $("oKey").value=status.agent?.openai?.apiKey||""; $("oModel").value=status.agent?.openai?.model||"";
  $("cUrl").value=status.agent?.customUrl||"";
  evt=new EventSource("/api/stream");
  evt.onmessage=(e)=>{const d=JSON.parse(e.data);
    if(d.type==="status"){status={...status,...d};renderStatus();}
    else if(d.type==="msg")addMsg(d);
    else if(d.type==="log")addLog(d.line);
  };
}
function renderStatus(){
  $("dotAuth").className="dot "+(status.authenticated?"ok":"bad");
  $("authTxt").textContent=status.authenticated?"✅ 已认证":"未认证";
  $("botIdTxt").textContent=status.botId||"";
}
function addLog(line){const el=$("log");el.innerHTML+=esc(line)+"\n";el.scrollTop=el.scrollHeight;}
function addMsg(d){
  $("feed").innerHTML+=`<div class="msg"><div class="who">${esc(d.ev)} · ${esc(d.time)}</div><pre>${showRaw?esc(JSON.stringify(d.frame,null,1)):esc(d.frame?.body?.text?.content??JSON.stringify(d.frame?.body??{}))}</pre></div>`;
  $("feed").scrollTop=$("feed").scrollHeight;
}
function startListen(){fetch("/api/config",{method:"POST",body:"{}"});location.reload();}
async function saveCfg(){
  await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({agent:{mode:$("agentMode").value,openai:{baseUrl:$("oBase").value,apiKey:$("oKey").value,model:$("oModel").value},customUrl:$("cUrl").value}})});
  alert("已保存");
}
async function doSend(){
  const r=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userid:$("sendUser").value,text:$("sendText").value})});
  alert(JSON.stringify(await r.json()));
}
boot();
</script>
</body>
</html>
